name: Prepare App Store Submission (Without Submitting)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number to attach (leave empty to attach latest or select in App Store Connect UI)'
        required: false
        default: ''
      app_version:
        description: 'App Version (default 1.0)'
        required: true
        default: '1.0'
  push:
    branches:
      - main
    paths:
      - 'ios/App/fastlane/**'
      - '.github/workflows/prepare-app-store-submission.yml'

jobs:
  prepare-submission:
    name: Upload Metadata & Screenshots to App Store Connect
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 🚀 Install Fastlane
        run: gem install fastlane --no-document

      - name: 📤 Deliver Metadata & Screenshots to App Store Connect
        working-directory: ios/App
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0' }}
        run: fastlane ios prepare_submission
