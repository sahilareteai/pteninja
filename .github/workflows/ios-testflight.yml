# Build & Deploy iOS to Apple TestFlight (GitHub Pro Priority Runner)
name: Build & Deploy iOS to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (leave blank to use GitHub run number)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: "ios-testflight"
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍎 Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: |
          npm install
          node scripts/patch-apple-auth.mjs

      - name: ⚡ Build Web Assets (Vite)
        run: npm run build

      - name: 📱 Sync Capacitor iOS Platform
        run: |
          npx cap sync ios
          node scripts/patch-apple-auth.mjs

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: 🚀 Install Fastlane
        run: gem install fastlane --no-document

      - name: 🛫 Build & Upload to Apple TestFlight
        working-directory: ios/App
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '3WJZNVGDTV' }}
          GITHUB_RUN_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: fastlane ios beta
